name: basic_curd
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  easy_localization: ^3.0.8
  flutter_bloc: ^9.1.1
  dart_either: ^2.0.0
  image_picker: ^1.2.1
  skeletonizer: ^2.1.3
  shimmer: ^3.0.0
  lottie: ^3.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

  build_runner: ^2.4.6
  hive_generator: ^2.0.1




flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/translations/
    - assets/animations/History.json
    - assets/screenshots/


flutter_native_splash:
  color: "#FA95AE"
  image: assets/logo.png
  android: true
  ios: true